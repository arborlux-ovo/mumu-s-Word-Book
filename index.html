<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>木木的单词本</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="word-book">
    <!--顶部导航【复习改成总复习】-->
    <div class="nav-bar">
        <div class="nav-item" onclick="showPage('home')"><span>首页</span></div>
        <div class="nav-item" onclick="showPage('add')"><span>新词</span></div>
        <div class="nav-item" onclick="showPage('review')"><span>总复习</span></div>
        <div class="nav-item" onclick="showPage('practice')"><span>练习</span></div>
    </div>
    <!--标题-->
    <div class="title-box">
        <span>木木的单词本</span>
    </div>

    <!-- 内容区域 -->
    <div class="content-wrap">
        <!--首页 单词列表页 -->
        <div id="page-home">
            <div class="two-col">
                <div class="col-left">
                    <div class="tab-label"><span>复习</span></div>
                    <div id="home-review-list">
                        <!--首页复习单词js自动渲染-->
                    </div>
                </div>
                <div class="col-right">
                    <div class="tab-label"><span>新词</span></div>
                    <div id="home-new-list">
                        <!--首页新词js自动渲染-->
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加新词页面 -->
        <div id="page-add" style="display:none">
            <div class="pink-item">加新词</div>
            <input class="pink-input" id="engInput" placeholder="英文">
            <input class="pink-input" id="chnInput" placeholder="中文">
            <div class="btn-group">
                <button class="pink-item" onclick="clearInput()">删除</button>
                <button class="pink-item" onclick="addWord()">添加</button>
            </div>
        </div>

        <!--总复习页面：展示全部单词 -->
        <div id="page-review" style="display:none">
            <div class="review-title">
                <span>总复习</span>
            </div>
            <div class="review-word-container" id="all-word-list">
                <!--所有单词在这里渲染-->
            </div>
        </div>

        <!--练习页面 -->
        <div id="page-practice" style="display:none">
            <div class="practice-title">
                <span>单词练习</span>
            </div>
            <div class="practice-buttons">
                <button class="practice-btn" onclick="getOrderWords()">顺序</button>
                <button class="practice-btn" onclick="getRandomWords()">随机</button>
            </div>
            <div class="practice-card-wrap" id="practice-container">
                <!--练习单词卡片渲染区域-->
            </div>
        </div>

    </div>
</div>

<!-- 第三步：使用Unicode编码 iconfont图标 -->
<div class="contact-float" onclick="openContactModal()">
    <span class="iconfont">&#xe601;</span>
</div>
<div class="help-float" onclick="openHelpModal()">
    <span class="iconfont">&#xe608;</span>
</div>

<!--弹窗遮罩-->
<div class="mask" id="contactMask">
    <div class="contact-modal">
        <h3>联系方式</h3>
        <p>开发者：罗利林</p>
        <p>电话：18788643792</p>
        <p>邮箱：486141385@qq.con</p>
        <button class="close-modal" onclick="closeContactModal()">关闭</button>
    </div>
</div>
<div class="mask" id="helpMask">
    <div class="help-modal">
        <h3>使用方法</h3>
        <p>1. 添加单词：点击【新词】页面录入单词；新增单词会在首页【新词】区域预览。</p>
        <p>2. 操作按钮：点击√，单词移入复习区继续复习；点击×，删除当前单词。</p>
        <p>3. 总复习：进入【总复习】页面，可以查看所有已经添加的单词。</p>
        <p>4. 单词练习：【练习】页面提供两种模式：顺序练习、随机练习。点击卡片切换中英文显示。</p>
        <button class="close-modal" onclick="closeHelpModal()">关闭</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
