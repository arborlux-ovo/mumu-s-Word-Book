<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>木木的单词本</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        /* ========== 全局单词本容器 固定尺寸 ========== */
        .word-book {
            width: 1100px;
            height: 940px;
            border: 3px solid #333;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        /* 顶部导航栏 */
        .nav-bar {
            display: flex;
            border-bottom: 2px solid #333;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            background-color: #ffc8d8;
            border-right:2px solid #333;
            cursor:pointer;
            transition: transform 0.12s;
        }
        .nav-item:active{
            transform: scale(0.96);
        }
        .nav-item:last-child{
            border-right:none;
        }
        .nav-item span{
            font-size: 32px;
            color:#555555;
            text-decoration: none;
            display:block;
        }
        /* 标题框 */
        .title-box{
            margin:10px 20px;
            border:2px solid #333;
            border-radius:12px;
            text-align:center;
            padding:8px;
        }
        .title-box span{
            font-size:48px;
            color:#444;
        }
        /* 主体绿色区域 */
        .content-wrap{
            background-color:#b8e9aa;
            margin:0 10px 10px;
            border:2px solid #333;
            border-radius:12px;
            height:720px;
            padding:20px;
        }
        /* ========== 首页单词列表页面 ========== */
        #page-home{
            display:block;
        }
        .two-col{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:8px;
            height:100%;
        }
        .tab-label{
            width: 280px;
            background:#ffc8d8;
            border:2px dashed #333;
            border-radius:8px;
            text-align:center;
            padding:6px 0;
            margin-bottom:20px;
            cursor:pointer;
            transition: transform 0.12s;
        }
        .tab-label:active{
            transform: scale(0.96);
        }
        .tab-label span{
            font-size:36px;
            color:#555555;
        }
        .col-left{
            border-right:2px dashed #333;
            padding-right:15px;
        }
        .col-right{
            padding-left:15px;
        }
        .word-row{
            display:flex;
            justify-content: space-between;
            border-bottom:2px dashed #333;
            height:80px;
            align-items:center;
            font-size:28px;
            color:#333;
        }
        .check-mark{
            font-size:36px;
            color:#444;
        }
        .check-mark span{
            cursor:pointer;
        }
        .check-mark span:active{
            transform: scale(0.9);
            display:inline-block;
        }
        /* ========== 添加新词页面 ========== */
        #page-add{
            display:none;
            height:100%;
            display:flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            padding:40px 60px;
        }
        .pink-item {
            width: 80%;
            background-color: #ffc8d8;
            border: 3px solid #222;
            border-radius: 20px;
            font-size: 48px;
            color: #444;
            padding: 12px 24px;
            text-align: center;
            transition: transform 0.15s ease;
            cursor:pointer;
        }
        .pink-item:active {
            transform: scale(0.96);
        }
        .pink-input {
            width: 80%;
            text-align: left;
            outline: none;
            border:3px solid #222;
            background:transparent;
            border-radius:20px;
            font-size:48px;
            padding:12px 24px;
        }
        /* 重复输入 绿色边框样式 */
        .pink-input.duplicate{
            border-color:green;
        }
        .btn-group {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            padding-right: 40px;
            margin-top:20px;
        }
        .btn-group .pink-item {
            width: 220px;
        }
        /* ========== 总复习页面 ========== */
        #page-review{
            display:none;
            height:100%;
            display:flex;
            flex-direction: column;
            align-items:center;
        }
        .review-title{
            width: 280px;
            background:#ffc8d8;
            border:2px dashed #333;
            border-radius:8px;
            text-align:center;
            padding:6px 0;
            margin-bottom:20px;
        }
        .review-title span{
            font-size:36px;
            color:#555555;
        }
        .review-word-container{
            width:100%;
            height:calc(100% - 80px);
            overflow-y:auto;
            padding:0 20px;
        }
        /* ========== 练习页面 ========== */
        #page-practice{
            display:none;
            height:100%;
            display:flex;
            flex-direction: column;
            align-items:center;
            gap:24px;
        }
        .practice-title{
            width: 280px;
            background:#ffc8d8;
            border:2px dashed #333;
            border-radius:8px;
            text-align:center;
            padding:6px 0;
        }
        .practice-title span{
            font-size:36px;
            color:#555555;
        }
        .practice-buttons{
            display:flex;
            gap:30px;
        }
        .practice-btn{
            width:200px;
            background:#ffc8d8;
            border: 3px solid #222;
            border-radius:20px;
            font-size:36px;
            color:#444;
            padding:10px;
            cursor:pointer;
            transition: transform 0.15s;
        }
        .practice-btn:active{
            transform:scale(0.96);
        }
        .practice-card-wrap{
            width:100%;
            flex-grow:1;
            overflow-y:auto;
            padding:0 30px;
        }
        .practice-card{
            background:#ffc8d8;
            border:3px solid #222;
            border-radius:16px;
            font-size:32px;
            color:#444;
            text-align:center;
            padding:20px;
            margin-bottom:16px;
            cursor:pointer;
            transition: transform 0.12s;
        }
        .practice-card:active{
            transform:scale(0.97);
        }

        /* ========== 右下角悬浮联系按钮 ========== */
        .contact-float{
            position: fixed;
            right:30px;
            bottom:120px;
            width:140px;
            height:70px;
            background:#ffc8d8;
            border:3px solid #333;
            border-radius:16px;
            font-size:32px;
            color:#444;
            text-align:center;
            line-height:64px;
            cursor:pointer;
            transition: transform 0.12s;
            z-index:999;
        }
        .contact-float:active{
            transform:scale(0.96);
        }
        /* 使用说明悬浮按钮 */
        .help-float{
            position: fixed;
            right:30px;
            bottom:30px;
            width:140px;
            height:70px;
            background:#ffc8d8;
            border:3px solid #333;
            border-radius:16px;
            font-size:32px;
            color:#444;
            text-align:center;
            line-height:64px;
            cursor:pointer;
            transition: transform 0.12s;
            z-index:999;
        }
        .help-float:active{
            transform:scale(0.96);
        }
        /* 弹窗遮罩层 */
        .mask{
            position:fixed;
            left:0;
            top:0;
            width:100vw;
            height:100vh;
            background:rgba(0,0,0,0.4);
            z-index:1000;
            display:none;
            justify-content:center;
            align-items:center;
        }
        /* 联系弹窗盒子 */
        .contact-modal{
            width:520px;
            background:#fff;
            border:3px solid #333;
            border-radius:20px;
            padding:40px;
            text-align:center;
        }
        .contact-modal h3{
            font-size:36px;
            margin-bottom:30px;
            color:#333;
        }
        .contact-modal p{
            font-size:30px;
            margin:16px 0;
        }
        /* 使用说明弹窗 */
        .help-modal{
            width:700px;
            background:#fff;
            border:3px solid #333;
            border-radius:20px;
            padding:40px;
        }
        .help-modal h3{
            font-size:36px;
            margin-bottom:20px;
            text-align:center;
        }
        .help-modal p{
            font-size:26px;
            line-height: 1.8;
        }
        .close-modal{
            margin-top:30px;
            width:180px;
            padding:10px;
            background:#ffc8d8;
            border:3px solid #333;
            border-radius:16px;
            font-size:28px;
            cursor:pointer;
            display:block;
            margin-left:auto;
            margin-right:auto;
        }
        .close-modal:active{
            transform:scale(0.96);
        }
    </style>
</head>
<body>
<div class="word-book">
    <!--顶部导航【复习改成总复习】-->
    <div class="nav-bar">
        <div class="nav-item" onclick="showPage('home')"><span>首页</span></div>
        <div class="nav-item" onclick="showPage('add')"><span>新词</span></div>
        <div class="nav-item" onclick="showPage('review')"><span>总复习</span></div>
        <div class="nav-item" onclick="showPage('practice')"><span>练习</span></div>
    </div>
    <!--标题-->
    <div class="title-box">
        <span>木木的单词本</span>
    </div>

    <!-- 内容区域 -->
    <div class="content-wrap">
        <!--首页 单词列表页 -->
        <div id="page-home">
            <div class="two-col">
                <div class="col-left">
                    <div class="tab-label"><span>复习</span></div>
                    <div id="home-review-list">
                        <!--首页复习单词js自动渲染-->
                    </div>
                </div>
                <div class="col-right">
                    <div class="tab-label"><span>新词</span></div>
                    <div id="home-new-list">
                        <!--首页新词js自动渲染-->
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加新词页面 -->
        <div id="page-add" style="display:none">
            <div class="pink-item">加新词</div>
            <input class="pink-input" id="engInput" placeholder="英文">
            <input class="pink-input" id="chnInput" placeholder="中文">
            <div class="btn-group">
                <button class="pink-item" onclick="clearInput()">删除</button>
                <button class="pink-item" onclick="addWord()">添加</button>
            </div>
        </div>

        <!--总复习页面：展示全部单词 -->
        <div id="page-review" style="display:none">
            <div class="review-title">
                <span>总复习</span>
            </div>
            <div class="review-word-container" id="all-word-list">
                <!--所有单词在这里渲染-->
            </div>
        </div>

        <!--练习页面 -->
        <div id="page-practice" style="display:none">
            <div class="practice-title">
                <span>单词练习</span>
            </div>
            <div class="practice-buttons">
                <button class="practice-btn" onclick="getOrderWords()">顺序</button>
                <button class="practice-btn" onclick="getRandomWords()">随机</button>
            </div>
            <div class="practice-card-wrap" id="practice-container">
                <!--练习单词卡片渲染区域-->
            </div>
        </div>

    </div>
</div>

<!--悬浮按钮：联系 + 使用说明-->
<div class="contact-float" onclick="openContactModal()">联系</div>
<div class="help-float" onclick="openHelpModal()">使用方法</div>

<!--弹窗遮罩-->
<div class="mask" id="contactMask">
    <div class="contact-modal">
        <h3>联系方式</h3>
        <p>开发者：罗利林</p>
        <p>电话：18788643792</p>
        <p>邮箱：486141385@qq.con</p>
        <button class="close-modal" onclick="closeContactModal()">关闭</button>
    </div>
</div>
<div class="mask" id="helpMask">
    <div class="help-modal">
        <h3>使用方法</h3>
        <p>1. 添加单词：点击【新词】页面录入单词；新增单词会在首页【新词】区域预览。</p>
        <p>2. 操作按钮：点击√，单词移入复习区继续复习；点击×，删除当前单词。</p>
        <p>3. 总复习：进入【总复习】页面，可以查看所有已经添加的单词。</p>
        <p>4. 单词练习：【练习】页面提供两种模式：顺序练习、随机练习。点击卡片切换中英文显示。</p>
        <button class="close-modal" onclick="closeHelpModal()">关闭</button>
    </div>
</div>

<script>
    // ========== 本地存储工具函数 ==========
    const STORAGE_KEY = "mumu_wordbook";
    function getWords(){
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    }
    function saveWords(arr){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    }

    // ========== 页面切换 ==========
    function showPage(pageName){
        const pageHome = document.getElementById("page-home");
        const pageAdd = document.getElementById("page-add");
        const pageReview = document.getElementById("page-review");
        const pagePractice = document.getElementById("page-practice");

        pageHome.style.display = "none";
        pageAdd.style.display = "none";
        pageReview.style.display = "none";
        pagePractice.style.display = "none";

        if(pageName === "home"){
            pageHome.style.display = "block";
            renderHomeList();
        }else if(pageName === "add"){
            pageAdd.style.display = "flex";
            //切换到新词页面，清除绿色高亮
            clearInputHighlight();
        }else if(pageName === "review"){
            pageReview.style.display = "flex";
            renderAllWordList();
        }else if(pageName === "practice"){
            pagePractice.style.display = "flex";
        }
    }

    // 清除输入框绿色边框
    function clearInputHighlight(){
        const eng = document.getElementById("engInput");
        const chn = document.getElementById("chnInput");
        eng.classList.remove("duplicate");
        chn.classList.remove("duplicate");
    }

    // ========== 添加单词【新增单词默认 status:new，进入首页新词栏】 ==========
    function addWord(){
        const engInput = document.getElementById("engInput");
        const chnInput = document.getElementById("chnInput");
        const eng = engInput.value.trim();
        const chn = chnInput.value.trim();

        clearInputHighlight();

        if(!eng || !chn){
            alert("英文和中文不能为空！");
            return;
        }
        const words = getWords();
        // 判断是否存在完全相同英文+中文的单词
        const isDuplicate = words.some(w=> w.english === eng && w.chinese === chn);
        if(isDuplicate){
            alert("添加失败，该单词已存在");
            engInput.classList.add("duplicate");
            chnInput.classList.add("duplicate");
            return;
        }

        words.push({
            english: eng,
            chinese: chn,
            status:"new"
        });
        saveWords(words);
        clearInput();
        alert("添加成功！");
        showPage("home");
    }
    //清空输入框
    function clearInput(){
        document.getElementById("engInput").value = "";
        document.getElementById("chnInput").value = "";
        clearInputHighlight();
    }

    // ========== 单词状态跳转逻辑 ==========
    function wordCheck(index){
        const words = getWords();
        const word = words[index];
        if(word.status === "new"){
            //新词栏点√ → 移动到首页复习栏 status:review
            word.status = "review";
        }else if(word.status === "review"){
            //首页复习栏点√ → 完成，status:finished，首页不再出现
            word.status = "finished";
        }
        saveWords(words);
        renderHomeList();
        renderAllWordList();
    }
    //删除单词
    function deleteWord(index){
        const words = getWords();
        words.splice(index,1);
        saveWords(words);
        renderHomeList();
        renderAllWordList();
    }

    // 首页左右两栏渲染：只展示 new 和 review 的单词，finished不显示在首页
    function renderHomeList(){
        const words = getWords();
        const reviewDom = document.getElementById("home-review-list");
        const newDom = document.getElementById("home-new-list");
        reviewDom.innerHTML = "";
        newDom.innerHTML = "";

        //分别筛选
        const newList = words.filter(item=>item.status === "new").slice(0,7);
        const reviewList = words.filter(item=>item.status === "review").slice(0,7);

        newList.forEach(item=>{
            const idx = words.indexOf(item);
            const row = document.createElement("div");
            row.className = "word-row";
            row.innerHTML = `
                <span>${item.english} : ${item.chinese}</span>
                <span class="check-mark">
                    <span onclick="wordCheck(${idx})">✓</span>
                    <span onclick="deleteWord(${idx})"> ×</span>
                </span>
  `         ;
            newDom.appendChild(row);
        })

        reviewList.forEach(item=>{
            const idx = words.indexOf(item);
            const row = document.createElement("div");
            row.className = "word-row";
            row.innerHTML = `
                <span>${item.english} : ${item.chinese}</span>
                <span class="check-mark">
                    <span onclick="wordCheck(${idx})">✓</span>
                    <span onclick="deleteWord(${idx})"> ×</span>
                </span>
            `;
        reviewDom.appendChild(row);
        })

    }

    // ========== 总复习页面：渲染【全部单词】不管任何状态 ==========
    function renderAllWordList(){
        const words = getWords();
        const container = document.getElementById("all-word-list");
        container.innerHTML = "";

        words.forEach((item,index)=>{
            const row = document.createElement("div");
            row.className = "word-row";
            row.innerHTML = `
                <span>${item.english} : ${item.chinese}</span>
                <span class="check-mark">
                    <span onclick="deleteWord(${index})">×</span>
                </span>
            `;
            container.appendChild(row);
        })
    }

    // ========== 练习页面功能（练习读取全部单词） ==========
    // 顺序取前10个单词
    function getOrderWords(){
        const allWords = getWords();
        if(allWords.length === 0){
            alert("还没有单词，请先添加单词！");
            return;
        }
        const pickWords = allWords.slice(0,10);
        renderPracticeCard(pickWords);
    }
    //随机抽取10个不重复单词
    function getRandomWords(){
        const allWords = getWords();
        if(allWords.length === 0){
            alert("还没有单词，请先添加单词！");
            return;
        }
        //打乱数组
        const shuffleArr = [...allWords].sort(()=> Math.random()-0.5);
        const pickWords = shuffleArr.slice(0,10);
        renderPracticeCard(pickWords);
    }
    //渲染练习卡片，点击卡片切换显示英文/中文
    function renderPracticeCard(wordList){
        const container = document.getElementById("practice-container");
        container.innerHTML = "";
        wordList.forEach(word=>{
            let showEng = true;
            const card = document.createElement("div");
            card.className = "practice-card";
            card.innerText = word.english;
            card.onclick = function(){
                showEng = !showEng;
                card.innerText = showEng ? word.english : word.chinese;
            }
            container.appendChild(card);
        })
    }

    // ========== 联系弹窗JS函数 ==========
    function openContactModal(){
        document.getElementById("contactMask").style.display = "flex";
    }
    function closeContactModal(){
        document.getElementById("contactMask").style.display = "none";
    }
    //使用说明弹窗函数
    function openHelpModal(){
        document.getElementById("helpMask").style.display = "flex";
    }
    function closeHelpModal(){
        document.getElementById("helpMask").style.display = "none";
    }

    // 页面初始化，进入页面立刻弹出使用说明弹窗
    window.onload = function(){
        const initWords = getWords();
        if(initWords.length === 0){
            const demoList = [
                {english:"apple",chinese:"苹果",status:"new"},
                {english:"banana",chinese:"香蕉",status:"new"},
                {english:"cat",chinese:"猫",status:"new"},
                {english:"dog",chinese:"狗",status:"new"},
                {english:"egg",chinese:"鸡蛋",status:"new"},
                {english:"fish",chinese:"鱼",status:"new"},
                {english:"goat",chinese:"山羊",status:"new"},
                {english:"hat",chinese:"帽子",status:"new"},
                {english:"ice",chinese:"冰",status:"new"},
                {english:"juice",chinese:"果汁",status:"new"},
            ];
            saveWords(demoList);
        }

        showPage("home");
        openHelpModal();
    }
</script>
</body>
</html>
